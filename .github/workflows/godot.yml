name: Godot offline checks
on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check converted data
        run: python3 tests/check_assets.py
      - name: Install Godot 4.3
        run: |
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          echo '/tmp/godot' >> "$GITHUB_PATH"
      - name: Import project and test matches
        shell: bash
        run: |
          set -o pipefail
          godot=Godot_v4.3-stable_linux.x86_64
          run_checked() {
            local status=0
            timeout 100s "$@" > /tmp/godot-check.log 2>&1 || status=$?
            cat /tmp/godot-check.log
            if grep -Eq '(^ERROR:|SCRIPT ERROR:|Parse Error:)' /tmp/godot-check.log; then
              grep -E '(^ERROR:|SCRIPT ERROR:|Parse Error:)' /tmp/godot-check.log | sort -u | head -9 | while IFS= read -r line; do
                echo "::error::$line"
              done
              return 1
            fi
            if [ "$status" != 0 ]; then echo "::error::Godot terminó con código $status: $*"; return "$status"; fi
          }
          run_checked "$godot" --headless --editor --path . --import
          run_checked xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 "$godot" --path . --script tests/smoke.gd
      - name: Export verified desktop builds
        run: |
          version=4.3.stable
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz 'templates/linux_release.x86_64' 'templates/windows_release_x86_64.exe' -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/$version" exports/linux exports/windows
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/$version/"
          godot=Godot_v4.3-stable_linux.x86_64
          "$godot" --headless --path . --export-release Linux
          "$godot" --headless --path . --export-release Windows
          test -s exports/linux/spd-offline.x86_64
          test -s exports/windows/spd-offline.exe
          chmod +x exports/linux/spd-offline.x86_64
          timeout 20s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 exports/linux/spd-offline.x86_64 --quit-after 5
          tar -C exports/linux -czf exports/SPD-Offline-Linux.tar.gz spd-offline.x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: SPD-Offline-Linux
          path: exports/SPD-Offline-Linux.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: SPD-Offline-Windows
          path: exports/windows/
