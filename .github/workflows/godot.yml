name: Godot offline checks
on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check converted data
        run: python3 tests/check_assets.py
      - name: Install Godot 4.3
        run: |
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          echo '/tmp/godot' >> "$GITHUB_PATH"
      - name: Import project and test matches
        shell: bash
        run: |
          set -o pipefail
          Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --import 2>&1 | tee /tmp/godot-import.log
          Godot_v4.3-stable_linux.x86_64 --headless --path . --script tests/smoke.gd 2>&1 | tee /tmp/godot-smoke.log
          if grep -E '(^ERROR:|SCRIPT ERROR:|Parse Error:)' /tmp/godot-{import,smoke}.log; then exit 1; fi
